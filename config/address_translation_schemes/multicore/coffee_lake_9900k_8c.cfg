#include address_translation_schemes/coffee_lake_9900k.cfg
# Coffee Lake i9-9900K host with 8 cores, for
# multithreaded programs: one core per thread, or the run aborts with "We cannot
# execute instructions while not on a core".
[general]
total_cores = 8

# Still one memory controller (the on-die IMC, 42 GB/s) for the whole chip: the
# base config places one controller every controllers_interleaving cores.
[perf_model/dram]
controllers_interleaving = 8
