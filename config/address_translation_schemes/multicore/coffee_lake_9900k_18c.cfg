#include address_translation_schemes/coffee_lake_9900k.cfg
[general]
# morsel-sched --cores=17 runs 16 workers + 1 manager, and its CLI thread makes
# 18. One core each: runSniper.py pins workers to 0-15, the manager to 16 and
# the CLI thread to 17 (--cpu-preference-*). Seventeen cores is not enough --
# two threads then share a core, and whichever one loses it aborts the run with
# "We cannot execute instructions while not on a core".
total_cores = 18
