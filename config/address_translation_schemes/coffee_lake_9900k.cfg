# Coffee Lake i9-9900K — Desktop Baseline
# =======================================
# Modern desktop processor model: Intel Core i9-9900K (Coffee Lake, 2018).
# Homogeneous Skylake-derived cores, explicit shared L3 LLC (NOT NUCA),
# DDR4-2666 dual-channel memory. Same address-translation / MMU / range-table
# stack as the parametric_baseline schemes (this fork's purpose).

# Base system (simulation basics)
#include ./common_configs/base_system_sniperspace.cfg

# Core and cache configuration (i9-9900K, explicit shared L3)
#include ./core_configs/coffee_lake_9900k.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration — DDR4-2666 dual channel, ~42 GB/s
#include ./dram_configs/ddr4_2666_2ch_42gbps.cfg

# Physical memory allocator
#include ./physical_memory_allocators/reserve_thp.cfg

# Desktop part: no CXL.
[perf_model/cxl]
enabled = false

# Pinned scheduler: each AvantGraph thread owns one simulated core (no
# time-sharing / migration), which keeps per-pipeline instruction attribution
# clean for agmarkers.py. Override with -g --scheduler/type=roaming if needed.
[scheduler]
type = pinned
