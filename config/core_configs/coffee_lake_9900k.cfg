# Coffee Lake i9-9900K Core Configuration
# ========================================
# Intel Core i9-9900K (Coffee Lake Refresh, 2018), Skylake-derived
# microarchitecture on Intel 14nm++. 8 cores / 16 threads on the real part;
# SMT is disabled here (logical_cpus = 1) for single-thread-per-core modelling.
#
# Cache hierarchy (per the real part):
#   L1I  32 KB  8-way   per core
#   L1D  32 KB  8-way   per core   (~4-5 cycle load-to-use)
#   L2  256 KB  4-way   per core   (~12 cycle)        -- inclusive of L1
#   L3   16 MB 16-way   SHARED     (~40+ cycle)        -- ring-bus LLC (NUCA)
#
# Per-core L1/L2 are private and modeled explicitly. The shared 16 MB LLC is
# modeled as NUCA (a single global structure) rather than an explicit shared L3:
# the explicit-shared-L3 path deadlocks in cache-only mode in this MMU fork.
# See the [perf_model/nuca] section below.

[core_debug]
name = "coffee_lake_9900k"

[perf_model/core]
# Rated base 3.6 GHz; all-core turbo ~4.7 GHz; single-core max 5.0 GHz.
# Modelling the rated base here -- bump to 4.7 to model sustained all-core turbo.
frequency = 3.6
logical_cpus = 1             # SMT (HyperThreading) disabled
core_model = "nehalem"
type = "rob"

[perf_model/core/interval_timer]
dispatch_width = 4           # 4-wide decode/rename (Skylake front-end)
window_size = 224            # 224-entry ROB

[perf_model/sync]
reschedule_cost = 1000

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
type = pentium_m
mispredict_penalty = 16      # ~14-19 stage Skylake pipeline

[perf_model/core/rob_timer]
in_order = false
issue_contention = true
mlp_histogram = false
issue_memops_at_issue = true
outstanding_loads = 128      # Significantly increased MLP
outstanding_stores = 72      # More store buffer entries
store_to_load_forwarding = true
address_disambiguation = true
rob_repartition = true
simultaneous_issue = true
commit_width = 8             # 8-wide retirement
rs_entries = 192             # Larger reservation station

[dvfs]
transition_latency = 2000

[dvfs/simple]
cores_per_socket = 1

[power]
vdd = 1.2                    # Lower voltage (Intel 4 process)
technology_node = 14          # Intel 4 ~ 7nm class

## ---- Memory subsystem ---- ##

[perf_model/cache]
levels = 2                   # L1 / L2 private; NUCA is the shared LLC (below)
mshr_size = 16

[perf_model/dram_directory]
total_entries = 16777216                  # cover the 16 MB NUCA LLC with headroom
associativity = 256
max_hw_sharers = 64                       # number of sharers supported in hardware (ignored if directory_type = full_map)
directory_type = full_map                 # Supported (full_map, limited_no_broadcast, limitless)
home_lookup_param = 6                     # Granularity at which the directory is stripped across different cores
directory_cache_access_time = 10          # Tag directory lookup time (in cycles)
locations = dram                          # dram: at each DRAM controller, llc: at master cache locations, interleaved: every N cores (see below)
interleaving = 1                          # N when locations=interleaved

[perf_model/l1_icache]
perfect = false
cache_block_size = 64
cache_size = 32              # 32 KB
associativity = 8
address_hash = mask
replacement_policy = lru
data_access_time = 4
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = none

[perf_model/l1_dcache]
perfect = false
cache_block_size = 64
cache_size = 32              # 32 KB
associativity = 8
address_hash = mask
replacement_policy = lru
data_access_time = 4         # ~4-5 cycle load-to-use
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
outstanding_misses = 10      # 10 line-fill buffers
prefetcher = none

[perf_model/l2_cache]
perfect = false
cache_block_size = 64
cache_size = 256             # 256 KB per core
associativity = 4            # Skylake client L2 is 4-way (low latency)
address_hash = mask
replacement_policy = lru
data_access_time = 12        # ~12 cycle
tags_access_time = 3
writeback_time = 0
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = none

[perf_model/llc]
evict_buffers = 8

# Shared LLC modeled as NUCA (one global structure), NOT an explicit per-core
# shared L3. The explicit shared-L3 path (perf_model/l3_cache, shared_cores>1)
# deadlocks in cache-only mode in this MMU fork -- the cross-core L3-master /
# directory handshake wedges. NUCA is a single global cache with no master-core
# handshake and is the proven LLC model here (parametric_baseline uses it).
# Sized to the i9-9900K's 16 MB ring-bus L3. Private per-core L1/L2 are above.
[perf_model/nuca]
enabled = true
address_hash = xor_mod
cache_size = 16384           # 16 MB shared LLC (whole chip)
associativity = 16
replacement_policy = lru
tags_access_time = 10
data_access_time = 35        # ~ring-bus LLC hit
bandwidth = 128

[perf_model/nuca/cache/srrip]
bits = 3
tlb_enabled = false

[perf_model/nuca/cache/qbs]
attempts = 4

[perf_model/nuca/queue_model]
enabled = true
type = history_list

[perf_model/nuca/mplru]
mode = disabled              # standard LRU (no metadata-protecting LRU)
mpki_threshold = 10.0

[perf_model/nuca/mplru/controller]
enabled = false

[perf_model/cache_usage]
enabled = false

# Range-table MMU metadata / shadow cache (this fork). Required by the MMU even
# when the shadow cache is disabled.
[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/mimicos_host]
enabled = "false"

[log]
enabled = false

[queue_model/basic]
moving_avg_enabled = "true"
moving_avg_type = "arithmetic_mean"
moving_avg_window_size = 1024
