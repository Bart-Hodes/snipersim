# Intel Core i7-13700K P-core (Raptor Cove, 2022), on top of the Coffee Lake
# file: only what differs is here. All cores are P-cores: the real part's E-cores
# are not modelled. Quantum: Sniper's default; 10 us changed run times by 6%.
#include core_configs/coffee_lake_9900k.cfg

[core_debug]
name = "raptor_lake_13700k"

[perf_model/core]
frequency = 3.4              # P-core base clock: native validation runs pin the host to it

[perf_model/core/interval_timer]
dispatch_width = 6
window_size = 512

[clock_skew_minimization/barrier]
quantum = 100

[perf_model/branch_predictor]
mispredict_penalty = 17

[perf_model/core/rob_timer]
outstanding_loads = 192
outstanding_stores = 114
rs_entries = 205

[perf_model/cache]
mshr_size = 48               # L2 superqueue

[perf_model/l1_dcache]
cache_size = 48              # sysfs: 48K
associativity = 12
outstanding_misses = 16

[perf_model/l2_cache]
cache_size = 2048            # sysfs: 2048K
associativity = 16

[perf_model/nuca]
cache_size = 30720           # sysfs: 30720K, whole chip
address_hash = rng1_mod      # 40960 sets: xor_mod indexes out of bounds unless a power of 2
associativity = 12
tags_access_time = 15
data_access_time = 55        # ~70 cycle LLC hit
