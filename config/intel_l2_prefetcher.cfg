# Intel's L2 prefetchers (Skylake .. Raptor Lake): the adjacent-line
# (spatial) prefetcher and the streamer, as prefetcher intel_l2
# (intel_l2_prefetcher.cc). Add after the system config:
#   run-sniper -c <system>.cfg -c intel_l2_prefetcher.cfg ...
[perf_model/l2_cache]
prefetcher = intel_l2

[perf_model/l2_cache/prefetcher]
prefetch_on_prefetch_hit = true # the streamer keeps running ahead on hits to its own prefetches

[perf_model/l2_cache/prefetcher/simple]
flows = 16
flows_per_core = false
num_prefetches = 5 # the first is the current line: 4 lines ahead
stop_at_page_boundary = true # the streamer stays inside a 4 KB page
