# Detailed DRAM — DDR4-2666 dual channel, 1 controller, ~42 GB/s
# ================================================================
# As ddr4_2666_2ch_42gbps.cfg (i9-9900K stock memory), but with the "ddr"
# model: banks, ranks and open rows (row hits/misses, row utilization stats)
# instead of the readwrite bandwidth model.
#   2 channels x 2 ranks x 16 banks (4 bank groups), 8 KB rows.
# Use after the system config (-c ... -c dram_configs/ddr4_2666_2ch_detailed):
# the number of controllers and their placement come from that config.
# Timings as ddr4_2400.cfg (~15 ns tRCD/tRP/tCL).

[perf_model/dram]
type = ddr
latency = 60                        # DDR4 device access latency in ns
per_controller_bandwidth = 42       # GB/s (DDR4-2666 dual channel, single IMC)
chips_per_dimm = 8
dimms_per_controller = 2
localdram_size = 1024

[perf_model/dram/queue_model]
enabled = true
type = basic

[perf_model/dram/ddr]
num_banks = 16
num_bank_groups = 4
num_ranks = 2
num_channels = 2
data_bus_width = 64
dram_speed = 2666
dram_page_size = 128                # cache lines (8 KB row)
open_page_mapping = true
randomize_address = false
randomize_offset = 0
column_bits_shift = 14
bank_keep_open = 120
constant_time_policy = false
selective_constant_time_policy = false
open_row_policy = true
bank_open_delay = 15
bank_close_delay = 15
access_cost = 15
intercommand_delay = 5
intercommand_delay_long = 5
intercommand_delay_short = 2.5
controller_delay = 20
refresh_interval = 64000000
refresh_length = 15
required_bank_bits = 4              # log2(16)
required_rank_bits = 1              # log2(2)
required_channel_bits = 1           # log2(2)
dram_page_size_bits = 7             # log2(128)
address_mapping = xor

[perf_model/dram/ddr/open_page]
channel_bits = 1
rank_bits = 1
bank_bits = 4
page_size_bits = 7

[perf_model/dram/ddr/open_page_split_column]
column_offset = 3

[perf_model/dram/ddr/closed_page]
column_bits_shift = 2

[perf_model/dram/ddr/xor]
channel_bits = 1
rank_bits = 1
bank_bits = 4
page_size_bits = 7
xor_offset = 0

[perf_model/cxl]
enabled = false
