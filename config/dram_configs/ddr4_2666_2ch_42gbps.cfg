# Read/Write DRAM — DDR4-2666 dual channel, 1 controller, ~42 GB/s
# ================================================================
# Intel i9-9900K stock memory: DDR4-2666, dual channel.
#   2 channels x 8 bytes x 2666 MT/s = 42.6 GB/s aggregate.
# Single memory controller (the on-die IMC), reads and writes share bandwidth.

[perf_model/dram]
# num_controllers = -1 with controllers_interleaving = 4 places one controller
# every 4 cores -> a single controller on the LLC master (core 0) for a 4-core,
# shared-L3 part. The directory is co-located there (required: tag directories
# may only sit on the shared cache's master node).
num_controllers = -1
controllers_interleaving = 4        # = l3_cache/shared_cores
type = readwrite
latency = 60                        # DDR4 device access latency in ns
per_controller_bandwidth = 42       # GB/s (DDR4-2666 dual channel, single IMC)

[perf_model/dram/queue_model]
enabled = true
type = history_list

[perf_model/dram/readwrite]
shared = true                       # Reads and writes contend on same bandwidth
